<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>AR 明信片 2.5D v3</title>

<script>
(() => {
  const gum = navigator.mediaDevices?.getUserMedia?.bind(navigator.mediaDevices);
  if (!gum) return;
  navigator.mediaDevices.getUserMedia = async (constraints={}) => {
    const c = JSON.parse(JSON.stringify(constraints || {}));
    const b = (typeof c.video === "object" && c.video) ? c.video : {};
    c.video = {
      ...b,
      facingMode: b.facingMode || {ideal:"environment"},
      width:{ideal:1920},
      height:{ideal:1080},
      frameRate:{ideal:30,max:30}
    };
    return gum(c);
  };
})();
</script>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,"Microsoft JhengHei",sans-serif}
#home{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:#efe7d9}
.panel{width:min(430px,100%);text-align:center;color:#2f281d}
.panel p{line-height:1.55}
button{border:0;border-radius:12px;min-height:50px;padding:0 20px;font-size:18px;font-weight:700}
#startBtn{width:100%;background:#2f281d;color:#fff}
#arRoot{position:fixed;inset:0;opacity:0;pointer-events:none;background:#000}
body.scanning #home{display:none}
body.scanning #arRoot{opacity:1;pointer-events:auto;z-index:1500}
a-scene{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;z-index:1500}
body.scanning video,body.scanning canvas{position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;object-fit:cover!important}
#hud{display:none;position:fixed;z-index:3000;left:12px;right:12px;top:max(12px,env(safe-area-inset-top));pointer-events:none}
body.scanning #hud{display:block}
#status,#camInfo{margin:0 auto 8px;max-width:520px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.68);color:#fff;text-align:center}
#camInfo{font-size:13px}
#stopBtn{display:none;position:fixed;right:14px;bottom:max(14px,env(safe-area-inset-bottom));z-index:3100;background:rgba(20,20,20,.82);color:#fff;border:1px solid rgba(255,255,255,.55)}
body.scanning #stopBtn{display:block}
</style>

<script>
AFRAME.registerComponent('cloud-drift',{
  schema:{ampX:{type:'number',default:.015},ampY:{type:'number',default:.005},speed:{type:'number',default:.00012},phase:{type:'number',default:0}},
  init(){this.base=this.el.object3D.position.clone()},
  tick(t){
    const d=this.data;
    this.el.object3D.position.x=this.base.x+Math.sin(t*d.speed+d.phase)*d.ampX;
    this.el.object3D.position.y=this.base.y+Math.cos(t*d.speed*.7+d.phase)*d.ampY;
    const m=this.el.getObject3D('mesh');
    if(m?.material){m.material.transparent=true;m.material.opacity=.46+.08*Math.sin(t*d.speed*.8+d.phase)}
  }
});

AFRAME.registerComponent('boat-motion',{
  init(){
    this.startX=-.165; this.endX=.165;
    this.baseY=-.122; this.z=.00105;
    this.duration=13000; this.lastWake=0;
    this.wakeRoot=document.querySelector('#wakeRoot');
  },
  tick(t){
    const p=(t%this.duration)/this.duration;
    const e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    const x=this.startX+(this.endX-this.startX)*e;
    const y=this.baseY+Math.sin(t*.0045)*.0035;
    this.el.object3D.position.set(x,y,this.z);
    if(t-this.lastWake>130){
      this.lastWake=t;
      this.spawnWake(x-.028,y-.007,.00092,t);
    }
  },
  spawnWake(x,y,z,t){
    if(!this.wakeRoot)return;
    const e=document.createElement('a-ellipse');
    e.setAttribute('position',`${x} ${y+Math.sin(t*.009)*.005} ${z}`);
    e.setAttribute('radius-x','.020');
    e.setAttribute('radius-y','.005');
    e.setAttribute('material','color:#d6eee7;transparent:true;opacity:.18;side:double;shader:flat;depthWrite:false');
    this.wakeRoot.appendChild(e);
    const born=performance.now(), life=1500, obj=e.object3D;
    const f=(now)=>{
      const q=(now-born)/life;
      if(q>=1){e.remove();return}
      obj.position.x-=.010*q;
      obj.scale.set(1+q*2.0,1+q*.8,1);
      const m=e.getObject3D('mesh');
      if(m?.material)m.material.opacity=.18*(1-q);
      requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  }
});
</script>
</head>

<body>
<div id="home">
  <div class="panel">
    <h1>AR 明信片 2.5D v3</h1>
    <p>場景再縮小並壓低 Z 軸，加入正式 water.png。</p>
    <button id="startBtn">開始 AR 掃描</button>
  </div>
</div>

<div id="arRoot">
<a-scene id="arScene"
  mindar-image="imageTargetSrc: ./assets/targets.mind; autoStart:false;"
  color-space="sRGB"
  renderer="colorManagement:true;physicallyCorrectLights:true;alpha:true"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  embedded>

<a-assets timeout="15000">
  <img id="backBridgeTex" src="./assets/backbridge.png">
  <img id="frontBridgeTex" src="./assets/front_bridge.png">
  <img id="waterTex" src="./assets/water.png">
  <img id="cloud1Tex" src="./assets/cloud1.png">
  <img id="cloud2Tex" src="./assets/cloud2.png">
  <img id="cloud3Tex" src="./assets/cloud3.png">
  <img id="cloud4Tex" src="./assets/cloud4.png">
  <video id="boatVideo" src="./assets/boat_alpha.webm" preload="auto" loop muted playsinline webkit-playsinline></video>
</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<a-entity id="target0" mindar-image-target="targetIndex:0">

  <!--
    IMPORTANT:
    前後橋使用完全相同 width / height / x / y。
    Z 差距只留 0.002，避免斜視時接縫產生明顯錯位。
    場景寬從 v1 的 0.88 縮到 0.64。
  -->

  <a-image src="#backBridgeTex"
    position="0 0 0.00035"
    width="0.52" height="0.39"
    material="transparent:true;opacity:1;side:double;shader:flat;depthWrite:false">
  </a-image>

  <!-- 真正 water.png 放進來後才會出現 -->
  <a-image src="#waterTex"
    position="0 0 0.00050"
    width="0.52" height="0.39"
    material="transparent:true;opacity:.72;side:double;shader:flat;depthWrite:false">
  </a-image>

  <a-image src="#cloud1Tex"
    position="-.085 .085 .00065"
    width=".155" height=".078"
    material="transparent:true;opacity:.50;side:double;shader:flat;depthWrite:false"
    cloud-drift="ampX:.012;ampY:.004;speed:.00012;phase:.3">
  </a-image>

  <a-image src="#cloud2Tex"
    position=".095 .102 .00075"
    width=".125" height=".062"
    material="transparent:true;opacity:.46;side:double;shader:flat;depthWrite:false"
    cloud-drift="ampX:.010;ampY:.003;speed:.00015;phase:1.2">
  </a-image>

  <a-image src="#cloud3Tex"
    position="-.012 .048 .00085"
    width=".14" height=".078"
    material="transparent:true;opacity:.44;side:double;shader:flat;depthWrite:false"
    cloud-drift="ampX:.011;ampY:.003;speed:.00010;phase:2.4">
  </a-image>

  <a-image src="#cloud4Tex"
    position=".018 .135 .00095"
    width=".17" height=".060"
    material="transparent:true;opacity:.38;side:double;shader:flat;depthWrite:false"
    cloud-drift="ampX:.008;ampY:.0025;speed:.00009;phase:3.2">
  </a-image>

  <a-entity id="wakeRoot"></a-entity>

  <a-video id="boat"
    src="#boatVideo"
    position="-.165 -.122 .00105"
    width=".092" height=".052"
    material="transparent:true;opacity:1;side:double;shader:flat;depthWrite:false"
    boat-motion
    visible="false">
  </a-video>

  <a-image src="#frontBridgeTex"
    position="0 0 0.00125"
    width="0.52" height="0.39"
    material="transparent:true;opacity:1;side:double;shader:flat;depthWrite:false">
  </a-image>

</a-entity>
</a-scene>
</div>

<div id="hud">
  <div id="status">尚未啟動</div>
  <div id="camInfo">Camera: 等待資訊…</div>
</div>
<button id="stopBtn">結束掃描</button>

<script>
const scene=document.getElementById('arScene');
const target=document.getElementById('target0');
const boat=document.getElementById('boat');
const boatVideo=document.getElementById('boatVideo');
const startBtn=document.getElementById('startBtn');
const stopBtn=document.getElementById('stopBtn');
const status=document.getElementById('status');
const camInfo=document.getElementById('camInfo');
let running=false,starting=false,ready=false,timer=null;

scene.addEventListener('loaded',()=>ready=true);
const getMindAR=()=>scene.systems&&scene.systems['mindar-image-system'];

function waitMindAR(timeout=8000){
  return new Promise((resolve,reject)=>{
    const t0=Date.now();
    const i=setInterval(()=>{
      const s=getMindAR();
      if(s){clearInterval(i);resolve(s)}
      else if(Date.now()-t0>timeout){clearInterval(i);reject(new Error('MindAR timeout'))}
    },100)
  })
}

async function unlockVideo(){
  try{await boatVideo.play();boatVideo.pause();boatVideo.currentTime=0}catch(e){console.warn(e)}
}

function updateCameraInfo(){
  const cam=[...document.querySelectorAll('video')].find(v=>v!==boatVideo&&v.srcObject);
  if(!cam){camInfo.textContent='Camera: 尚未取得串流';return}
  const tr=cam.srcObject.getVideoTracks()[0], s=tr.getSettings?.()||{};
  camInfo.textContent=`Camera: ${cam.videoWidth||s.width||'?'}×${cam.videoHeight||s.height||'?'} @ ${Math.round(s.frameRate||0)||'?'}fps`;
}

async function startAR(){
  if(starting||running)return;
  starting=true; document.body.classList.add('scanning');
  status.textContent='正在啟動高解析度後鏡頭…';
  try{
    await unlockVideo();
    if(!ready&&!scene.hasLoaded)await new Promise(r=>scene.addEventListener('loaded',r,{once:true}));
    const sys=await waitMindAR(); await sys.start();
    running=true; status.textContent='相機已開啟，請對準明信片';
    timer=setInterval(updateCameraInfo,500); setTimeout(updateCameraInfo,500);
  }catch(e){
    console.error(e); document.body.classList.remove('scanning');
    alert('相機啟動失敗，請確認 HTTPS 與相機權限。');
  }finally{starting=false}
}

async function stopAR(){
  clearInterval(timer);
  try{
    boatVideo.pause(); boat.setAttribute('visible',false);
    const sys=getMindAR(); if(sys&&running)await sys.stop();
  }catch(e){}
  running=false; document.body.classList.remove('scanning');
}

target.addEventListener('targetFound',async()=>{
  status.textContent='辨識成功 ✓ 2.5D 場景播放中';
  boat.setAttribute('visible',true);
  try{await boatVideo.play()}catch(e){console.warn(e)}
});
target.addEventListener('targetLost',()=>{
  status.textContent='失去 target，請重新對準';
  boat.setAttribute('visible',false); boatVideo.pause();
});

startBtn.addEventListener('click',startAR);
stopBtn.addEventListener('click',stopAR);
</script>
</body>
</html>
